services:
  - type: web
    name: multisource-bitchord
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /manifest.json
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BITCHORD_HOSTS
        sync: false
      - key: PRODPWH_ADDON_URL
        sync: false
