name: Provider playback smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe provider search and playable streams
        env:
          SMOKE_TIMEOUT_MS: "10000"
        run: node scripts/provider-smoke.js
